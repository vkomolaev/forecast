<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://openweathermap.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="5-day weather forecast for any city" />
    <meta name="theme-color" content="#e6eae7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#182033" media="(prefers-color-scheme: dark)" />
    <title>Forecast</title>
    <script>
      // Applies a saved theme before the first paint, the app takes over after that.
      try {
        const theme = JSON.parse(localStorage.getItem('forecast.theme'))
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
